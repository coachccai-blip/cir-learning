name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/game-professional-ui-s9wdc2', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Le projet vit dans un sous-dossier : à la racine du dépôt ne reste que le
    # fichier jouable hors ligne, pour qu'on le trouve sans chercher après
    # avoir dézippé.
    defaults:
      run:
        working-directory: 'Learn CIR'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'Learn CIR/package-lock.json'
      - run: npm ci
      - run: npm run test
      - run: npm run build
      # La version hors ligne est versionnée : si quelqu'un modifie le jeu sans
      # la régénérer, elle se périme en silence. On la reconstruit ici et on
      # échoue si elle diffère de celle du dépôt (la sortie est reproductible).
      - name: Vérifier que la version hors ligne est à jour
        run: |
          npm run build:standalone
          git -C .. diff --exit-code -- Learn-CIR-hors-ligne.html \
            || { echo "::error::Learn-CIR-hors-ligne.html est périmé — lancez « npm run build:standalone » depuis « Learn CIR » et validez le fichier."; exit 1; }
          npm run build
      # GitHub Pages en mode « Deploy from a branch » exécute Jekyll, qui ignore
      # tout fichier ou dossier commençant par un souligné. Ce marqueur le coupe.
      - run: touch dist/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: './Learn CIR/dist'
          include-hidden-files: true
          retention-days: 1
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './Learn CIR/dist'

  # Publication n° 1 — quand Settings → Pages → Source vaut « GitHub Actions ».
  # Sur une branche de travail, Pages refuse le déploiement : on s'arrête au
  # build, qui a déjà fait tourner les tests.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publication n° 2 — quand Source vaut « Deploy from a branch ». Dans ce mode,
  # GitHub ignore complètement l'artefact ci-dessus et sert le contenu d'une
  # branche : sans cette étape, il servirait la racine du dépôt, dont
  # l'index.html est l'entrée Vite de développement (elle charge
  # /src/main.tsx, absent du build) — d'où une page blanche.
  # On pousse donc le site construit sur `gh-pages`, cible à sélectionner.
  publish-branch:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Pousser le site construit sur gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Site construit depuis ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
